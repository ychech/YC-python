services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yc
      POSTGRES_PASSWORD: yc
      POSTGRES_DB: yc_python
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://yc:yc@db:5432/yc_python
      JWT_SECRET: dev-only-change-me
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: ["sh", "-lc", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]

  web:
    build:
      context: ./web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pg_data:
